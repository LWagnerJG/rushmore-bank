name: Beans preview checks
on:
  pull_request:
    branches: [main, cursor/beans-test-preview-3333]
  push:
    branches: [codex/beans-preview]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: node --experimental-vm-modules scripts/verify-beans.mjs
      - run: npm run build
