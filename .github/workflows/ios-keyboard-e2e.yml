name: iOS keyboard e2e (WebKit)

# Real app (production build) + local PartyServer, with an emulated iOS
# keyboard: text fields must stay still and above the keyboard while typing,
# and one tap must submit. See scripts/verify-ios-keyboard.ts.

on:
  pull_request:
    paths:
      - "src/**"
      - "party/**"
      - "public/**"
      - "scripts/ios-keyboard-emulator.js"
      - "scripts/verify-ios-keyboard.ts"
      - "scripts/smoke-lib.ts"
      - "next.config.ts"
      - "postcss.config.mjs"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ios-keyboard-e2e.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "party/**"
      - "public/**"
      - "scripts/ios-keyboard-emulator.js"
      - "scripts/verify-ios-keyboard.ts"
      - "scripts/smoke-lib.ts"
      - "next.config.ts"
      - "postcss.config.mjs"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ios-keyboard-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_PARTYKIT_HOST: 127.0.0.1:8787
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright WebKit
        run: npx playwright install --with-deps webkit
      - name: Start local PartyServer
        run: npx wrangler dev --ip 127.0.0.1 --port 8787 > "$RUNNER_TEMP/wrangler.log" 2>&1 &
      - name: Build app against the local PartyServer
        run: npx next build
      - name: Start app
        run: npx next start -H 127.0.0.1 -p 3100 > "$RUNNER_TEMP/next.log" 2>&1 &
      - name: Wait for both servers
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:3100/api/version >/dev/null && \
               (exec 3<>/dev/tcp/127.0.0.1/8787) 2>/dev/null; then
              echo "servers up"
              exit 0
            fi
            sleep 1
          done
          echo "servers failed to start"
          tail -n 100 "$RUNNER_TEMP/wrangler.log" "$RUNNER_TEMP/next.log"
          exit 1
      - name: iOS keyboard e2e (390×844, 375×667)
        env:
          BASE_URL: http://127.0.0.1:3100
          PARTY_HOST: 127.0.0.1:8787
          OUT_DIR: ${{ runner.temp }}/ios-keyboard
        run: npm run test:ios-keyboard
      - name: Upload report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-keyboard-e2e
          path: ${{ runner.temp }}/ios-keyboard
          if-no-files-found: ignore
      - name: Server logs
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/wrangler.log" "$RUNNER_TEMP/next.log" || true
