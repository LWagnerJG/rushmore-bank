name: Prod health smokes

on:
  schedule:
    # ~9:00 AM America/New_York year-round (UTC-4 / UTC-5).
    # 13:00 UTC ≈ 9am EDT; 14:00 UTC ≈ 9am EST.
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: POST /api/judge smoke
        env:
          JUDGE_SECRET: ${{ secrets.JUDGE_SECRET }}
          # Optional repo variable; script defaults to https://beans-game.vercel.app
          JUDGE_URL: ${{ vars.JUDGE_URL }}
        run: node scripts/judge-smoke.mjs

  # Folded PartyServer lobby check (same script as server-health.yml).
  party:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: PartyServer lobby broadcast
        env:
          PARTY_HOST: beans-party.beans-lwagner.workers.dev
          HEALTH_TIMEOUT_MS: "15000"
          HEALTH_STEP_MS: "8000"
        run: npx tsx scripts/server-health.ts
