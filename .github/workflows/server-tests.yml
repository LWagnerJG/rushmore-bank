name: Server & shared regression tests

on:
  pull_request:
    paths:
      - "party/**"
      - "src/**"
      - "test/**"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - "vitest.config.ts"
      - ".github/workflows/server-tests.yml"
  push:
    branches: [main]
    paths:
      - "party/**"
      - "src/**"
      - "test/**"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - "vitest.config.ts"
      - ".github/workflows/server-tests.yml"

permissions:
  contents: read

jobs:
  deadlines:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright WebKit
        run: npx playwright install --with-deps webkit
      # Full suite (includes die-face pip invariants — blocks merge on failure).
      - run: npm test
      # Explicit die pip / face clamp gate (never paint 0 or 7+ pips on a face).
      - name: Die face pip invariants
        run: npx vitest run src/shared/__tests__/die-face.test.ts
      - run: npx tsc --noEmit
